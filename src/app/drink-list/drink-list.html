<a class ="add-link" routerLink="/drinks/new">+Thêm thức uống mới</a>
<label for = "searchDrink">Tìm nước uống</label>
<input
    id="searchDrink"
    type="text"
    placeholder="Nhập tên món ..."
    [value]="searchDrink()"
    (input)="timKiem($any($event.target).value)"
/>
<div class="sort-controls">
    <button type="button" (click)="sapXepGiaTang()">Giá tăng dần</button>
    <button type="button" (click)="sapXepGiaGiam()">Giá giảm dần</button>
</div>

<p class="ket-qua">Tìm thấy {{ soKetQua() }} món</p>

@for(loaiTra of dsHienThi(); track loaiTra.id)
{
    <a class="drink-button" [routerLink]="['/drinks', loaiTra.id]">
        @if(loaiTra.isPopular){
            <span aria-label="Yêu thích">🔥</span>
        }
        @if(loaiTra.id === monDatNhat())
        {
            <span aria-label="Đắt nhất" title="Đắt nhất">💎</span>
        }
        Chọn món {{ loaiTra.name}}
    </a>
}@empty {
    <p>Không tìm thấy món phù hợp.</p>
}
