<h2>Thêm công thức mới</h2>

<form class="drink-form" (submit)="save($event)">
    <mat-form-field appearance="outline" class="field">
        <mat-label>Tên nước uống</mat-label>
        <input matInput id="drink-name" type="text" [formField]="drinkForm.name"/>
    </mat-form-field>

    <mat-form-field appearance="outline" class="field">
        <mat-label>Mô tả</mat-label>
        <input matInput id="drink-desc" type="text" [formField]="drinkForm.description"/>
    </mat-form-field>

    <mat-form-field appearance="outline" class="field">
        <mat-label>Giá cơ bản</mat-label>
        <input matInput id="drink-price" type="number" [formField]="drinkForm.giaCoBan"/>
    </mat-form-field>

    <mat-form-field appearance="outline" class="field">
        <mat-label>Email người tạo</mat-label>
        <input matInput id="drink-author" type="email" [formField]="drinkForm.authorEmail"/>
    </mat-form-field>

    <button matButton="filled" class="submit-button" type="submit">Lưu công thức</button>
</form>
